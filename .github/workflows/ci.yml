name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Design-system guardrails + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tokens are in sync with tokens.json
        run: |
          npm run tokens
          git diff --exit-code src/ds/tokens/_tokens.scss || (echo "Run 'npm run tokens' and commit the result." && exit 1)
      - name: Feature code uses only the design system
        run: npm run check:ds
      - name: Build
        run: npx ng build

  publish-code-connect:
    name: Publish Code Connect to Figma
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # required: the official example omits this step
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish mappings
        run: npx figma connect publish --exit-on-unreadable-files
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
